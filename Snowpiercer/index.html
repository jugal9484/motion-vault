<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOWPIERCER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Layer 1: Film grain (canvas) -->
    <canvas id="grain"></canvas>

    <!-- Layer 2: Atmospheric particles + breach sparks (canvas) -->
    <canvas id="particles"></canvas>

    <!-- Layer 3: Vignette -->
    <div class="vignette"></div>

    <!-- Layer 4: The Breach — a crack of light that splits the void -->
    <div class="breach" id="breach">
        <div class="breach__glow" id="breach-glow"></div>
    </div>

    <!-- Layer 5: Subliminal flash on crystallization -->
    <div class="flash" id="flash"></div>

    <!-- Layer 6: Shockwave pulse ring -->
    <div class="pulse" id="pulse"></div>

    <!-- Layer 7: Title -->
    <main class="stage">
        <h1 class="title" id="title" aria-label="SNOWPIERCER"></h1>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
